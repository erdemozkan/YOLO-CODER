[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yoco"
version = "0.0.2"
description = "An AI agent that fixes your broken CLI commands automatically using a local LLM"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "erdemozkan", email = "ozkanerdem@gmail.com" }
]
keywords = ["ai", "llm", "cli", "debugging", "automation", "ollama", "developer-tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Utilities",
]
dependencies = [
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "colorama>=0.4.6",
]

[project.scripts]
yoco = "yoco:main"

[project.urls]
Homepage = "https://github.com/erdemozkan/YOLO-CODER"
Repository = "https://github.com/erdemozkan/YOLO-CODER"
"Bug Tracker" = "https://github.com/erdemozkan/YOLO-CODER/issues"

[tool.setuptools]
py-modules = ["yoco", "yoco_replace"]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "skills*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.yaml", "*.yml"]
